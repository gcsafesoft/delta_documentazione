<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ufficio Sicurezza - Delta Impianti</title>
<style>
:root{--bg:#000;--pan:#11141a;--bd:#232a34;--tx:#f3f5f8;--mut:#8b96a6;--or:#f28c1e;--bl:#1a86d0;--vi:#7c88ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 40% at 0% 0%,rgba(242,140,30,.20),transparent 70%),radial-gradient(70% 40% at 100% 8%,rgba(26,134,208,.20),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 44px}
.logo{background:#fff;border-radius:18px;padding:12px;margin-bottom:22px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.logo img{display:block;width:100%;height:auto}
h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:.78rem;margin:26px 2px 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-weight:650}
.s{color:var(--mut);margin:6px 0 0;font-size:.95rem;line-height:1.45}
.hide{display:none!important}
.view{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* login */
.lk{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 16px;background:linear-gradient(135deg,var(--or),#d9620b);box-shadow:0 8px 28px rgba(242,140,30,.35)}
.lk svg{width:30px;height:30px}
.box{background:var(--pan);border:1px solid var(--bd);border-radius:20px;padding:24px 20px;text-align:center}
input[type=text],input[type=password],input[type=search]{width:100%;padding:15px 16px;font-size:1rem;color:var(--tx);background:#0a0c10;border:1px solid var(--bd);border-radius:12px;margin-top:10px}
.box input{text-align:left}
input:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button.p{width:100%;margin-top:14px;padding:15px;font-size:1rem;font-weight:700;border:0;border-radius:12px;background:linear-gradient(135deg,var(--or),#e0700f);color:#121212}
.err{color:#ff7b7b;font-size:.9rem;min-height:1.3em;margin-top:10px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ghost{background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 14px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}

/* cards */
.feat,.fold{display:flex;align-items:center;gap:16px;width:100%;padding:18px;margin-bottom:12px;border:1px solid var(--bd);border-radius:18px;color:var(--tx);text-decoration:none;text-align:left;font:inherit;background:linear-gradient(120deg,var(--g),#10131a 65%);position:relative;overflow:hidden}
.feat:active,.fold:active,.doc:active{transform:scale(.985)}
.tile{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 6px 20px var(--g)}
.tile svg{width:30px;height:30px}
.feat b,.fold b{display:block;font-size:1.08rem;font-weight:700}
.feat small,.fold small{display:block;margin-top:3px;color:var(--mut);font-size:.85rem}
.grow{flex:1;min-width:0}
.chev{flex:none;width:22px;height:22px;opacity:.6}
.badge{flex:none;min-width:34px;text-align:center;font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--bd)}

/* folder view */
.head{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.head .tile{width:52px;height:52px}
.list{margin-top:6px}
.doc{display:flex;align-items:center;gap:14px;padding:13px 14px;margin-bottom:9px;background:var(--pan);border:1px solid var(--bd);border-radius:14px;color:var(--tx);text-decoration:none}
.doc .em{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:rgba(255,255,255,.06);border-left:3px solid var(--c)}
.doc b{display:block;font-size:.98rem;font-weight:600;line-height:1.3;word-break:break-word}
.doc small{display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--mut);font-size:.78rem}
.doc small i{font-style:normal;color:#fff;background:#c93a3a;border-radius:5px;padding:1px 6px;font-size:.68rem;font-weight:700}
#gq{margin-top:18px}
.vuoto{color:var(--mut);text-align:center;padding:24px 8px}
footer{margin-top:30px;color:var(--mut);font-size:.78rem;text-align:center}
</style>
</head>

schio-Rumore.pdf?rlkey=be8s1sthss7kia5mts1gj26ed&st=zeh1dy3x&dl=0", "titolo": "Valutazione Rischio Rumore", "tag": "Allegato 14"}, {"nome": "all_15 Norme Di Sicurezza Lavori Ambienti Confinati", "link": "https://www.dropbox.com/scl/fi/gkv52fvx0hvicf4u6fd0t/All.-15-Norme-Di-Sicurezza-Lavori-Ambienti-Confinati.pdf?rlkey=nx8gjcq9xbasemdikdk7nsv99&st=clpu0pmf&dl=0", "titolo": "Norme Di Sicurezza Lavori Ambienti Confinati", "tag": "Allegato 15"}, {"nome": "All_16 Schede Di Sicurezza Rischio Chimico", "link": "https://www.dropbox.com/scl/fi/6qzl93zo3cdy6xb9bpup3/ALL_16-SCHEDE-SICUREZZA-RISCHIO-CHIMICO.pdf?rlkey=sbn0opiql1pcgzj8beqawh53l&st=j874qub1&dl=0", "titolo": "Schede Di Sicurezza Rischio Chimico", "tag": "Allegato 16"}]}, {"nome": "Procedure di Sicurezza", "icon": "Procedure", "desc": "Procedure e norme di sicurezza", "c": "#7c88ee", "c2": "#4a55c4", "g": "rgba(124,136,238,.22)", "files": [{"nome": "Procedura Guida Sicura", "link": "https://www.dropbox.com/scl/fi/2d1vihfrqhyj70t8uu8yh/Procedura-Guida-Sicura-rev.2.pdf?rlkey=bjvfmbrdjutz7fpyohuqq1jtu&st=uzqsy84q&dl=0", "titolo": "Procedura Guida Sicura", "tag": ""}, {"nome": "Procedura Stress Caldo Freddo", "link": "https://www.dropbox.com/scl/fi/rd2e1pz40me99isnfuxnp/Procedura-per-attivit-in-clima-caldo-e-freddo-di-DELTA-IMPIANTI.pdf?rlkey=6iiod36xudkphpm9mxmqxdqxo&st=2w0sp60g&dl=0", "titolo": "Procedura Stress Caldo Freddo", "tag": ""}, {"nome": "Procedura Lavori in Quota su palificazione", "link": "https://www.dropbox.com/scl/fi/ekupyqgkq4zyyxcopyhc9/PROCEDURE-DI-SICUREZZA-DELTA-SALITA-SU-PALI-R02.pdf?rlkey=9s0x5u76f1gvyoqxiy1bnocfw&st=vj4ku8et&dl=0", "titolo": "Procedura Lavori in Quota su palificazione", "tag": ""}, {"nome": "Procedura attività in Ambienti Confinati", "link": "https://www.dropbox.com/scl/fi/r96ijr9z1an1piz8np3r0/Procedura-accesso-ambienti-confinati-di-DELTA-IMPIANTI.pdf?rlkey=3ehatoukpkldon1ilfbzr1vmq&st=dz6p1xbt&dl=0", "titolo": "Procedura attività in Ambienti Confinati", "tag": ""}, {"nome": "Procedura attività lavori Elettrici", "link": "https://www.dropbox.com/scl/fi/c41qdphyvvds7xjj3ab7h/PROCEDURE-DI-SICUREZZA-DELTA-LAVORI-ELETTRICI.pdf?rlkey=vxo61sr5emrbpdwd0uhqa1ju9&st=1vnaxqvf&dl=0", "titolo": "Procedura attività lavori Elettrici", "tag": ""}, {"nome": "Procedura attività lavori con utilizzo PLE", "link": "https://www.dropbox.com/scl/fi/mpd97klv50nb8li95ivox/Procedura-per-l-utilizzo-di-piattaforma-aerea-PLE-di-Delta-Impianti.pdf?rlkey=jsxh16iey6f7bzvy696qxnlkr&st=y6g2mjoi&dl=0", "titolo": "Procedura attività lavori con utilizzo PLE", "tag": ""}, {"nome": "Procedura apposizione Segnaletica Stradale", "link": "https://www.dropbox.com/scl/fi/6n6p9xjhnkoa02irbdy9m/Procedura-operativa-allestimento-cantiere-stradale-rev0.pdf?rlkey=rdwvnvqnm0nvzo7blutrfnft9&st=sf8dw4x0&dl=0", "titolo": "Procedura apposizione Segnaletica Stradale", "tag": ""}, {"nome": "Valutazione impatto Acustico Cantieri Stradale", "link": "https://www.dropbox.com/scl/fi/bxb3hcpta78m951xtpczb/Gestione-dell-impatto-Acustico-in-Delta-Impianti.pdf?rlkey=f3ddgqbpckw7s8v29tvs182ki&st=vmd7ozbz&dl=0", "titolo": "Valutazione impatto Acustico Cantieri Stradale", "tag": ""}, {"nome": "Procedura controllo cassette mediche e di soccorso", "link": "https://www.dropbox.com/scl/fi/ohtjp5rafl6vtonuatei4/Modalit-controllo-cassette-pronto-soccoso-e-mediche-di-Delta-Impianti.pdf?rlkey=njvjh46qug7olgmnlitcsmo6v&st=nl9bfrcp&dl=0", "titolo": "Procedura controllo cassette mediche e di soccorso", "tag": ""}, {"nome": "Procedura Dismissioni Pali", "link": "https://www.dropbox.com/scl/fi/vjiif7hq3evzj0t854rb2/Procedura-dismissioni-Pali-e-spezzoni-Delta-rev.1-25_06_2026.pdf?rlkey=fqw6tar9mau9b6bh7cw88lvgi&st=7ub7gku6&dl=0", "titolo": "Procedura Dismissioni Pali", "tag": ""}]}]};
const USERS={"QURNSU4=":"REVMVEFBRA==","RE9DTUFSQU5P":"TUFSQU5P","RE9DTUFURVJB":"TUFURVJB","RE9DRUJPTEk=":"RUJPTEk=","RE9DU0FMQQ==":"U0FMQQ==","RE9DRlJPUw==":"RlJPU0lOT05F"};
const ICON = {
  POS:'<path d="M9 4h6v3H9z"/><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m9 14 2 2 4-4"/>',
  Metodi:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  Procedure:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  Home:'<path d="M12 3 4 9v11h5v-6h6v6h5V9z"/>'
};
const EMO = [
 [/rischi.*dpi|dpi/i,'🦺'],[/pericolo/i,'⚠️'],[/competenz/i,'🎓'],[/apertura|chiusura/i,'🚧'],[/segnaletic/i,'🚸'],
 [/giunzion|terminazion/i,'🔗'],[/posa cavo|cavo/i,'🔌'],[/palific|pali/i,'🗼'],[/accessori/i,'🔧'],[/scavo/i,'⛏️'],
 [/aerei/i,'🪜'],[/emergenz/i,'🚨'],[/rumore|acustic/i,'🔊'],[/confinat/i,'🕳️'],[/chimic/i,'🧪'],
 [/guida/i,'🚗'],[/caldo|freddo/i,'🌡️'],[/elettric/i,'⚡'],[/ple\b/i,'🏗️'],[/stradal/i,'🛣️'],
 [/cassett|soccors|medic/i,'🩹'],[/dismission/i,'♻️'],[/pos/i,'📋'],[/quota/i,'🪜']
];
const emoji = t => { for(const [r,e] of EMO) if(r.test(t)) return e; return '📄'; };
const svg = (k,col,s=2) => '<svg viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="'+s+'" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
const show = id => { ['login','home','folder'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id)); window.scrollTo(0,0); };
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; };
const vars = o => '--c:'+o.c+';--c2:'+o.c2+';--g:'+o.g;

let LOG=false, CUR=null;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const match=(f,q)=>{const t=norm(f.nome+' '+(f.titolo||'')); return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w));};

function entra(){
  let ok=false;
  try{
    const u=btoa(document.getElementById('u').value.replace(/\s/g,'').toUpperCase());
    const p=btoa(document.getElementById('p').value.trim().toUpperCase());
    ok=(USERS[u]===p);
  }catch(e){}
  if(ok){
    LOG=true; try{sessionStorage.setItem('ok','1')}catch(e){}
    vaiHome(); try{history.replaceState({v:'home'},'')}catch(e){}
  } else document.getElementById('err').textContent="Utente o password errati. Riprova.";
}
function esci(){ try{sessionStorage.removeItem('ok')}catch(e){} location.reload(); }

function docCard(f,col,tag){
  const a=el('a','doc'); a.href=f.link; a.target='_blank'; a.rel='noopener'; a.style.setProperty('--c',col);
  a.innerHTML='<div class="em"></div><div class="grow"><b></b><small><i>PDF</i><span></span></small></div>'+CHEV;
  a.querySelector('.em').textContent=emoji(f.nome);
  a.querySelector('b').textContent=f.titolo||f.nome;
  a.querySelector('span').textContent=tag||'Tocca per aprire';
  return a;
}

function vaiHome(){
  const f=document.getElementById('feat'), b=document.getElementById('fold'); f.innerHTML=''; b.innerHTML='';
  DATA.home.forEach(d=>{
    const a=el('a','feat'); a.href=d.link; a.target='_blank'; a.rel='noopener'; a.style.cssText=vars({c:'#f28c1e',c2:'#d9620b',g:'rgba(242,140,30,.22)'});
    a.innerHTML='<div class="tile">'+svg('Home','#121212')+'</div><div class="grow"><b></b><small>Documento generale · tocca per aprire</small></div>'+CHEV;
    a.querySelector('b').textContent=d.nome; f.appendChild(a);
  });
  DATA.folders.forEach((c,i)=>{
    const bt=el('button','fold'); bt.style.cssText=vars(c);
    bt.innerHTML='<div class="tile">'+svg(c.icon,'#fff')+'</div><div class="grow"><b></b><small></small></div><span class="badge"></span>'+CHEV;
    bt.querySelector('b').textContent=c.nome; bt.querySelector('small').textContent=c.desc;
    bt.querySelector('.badge').textContent=c.files.length; bt.onclick=()=>apri(i,true); b.appendChild(bt);
  });
  cerca(document.getElementById('gq').value);
  show('home');
}
function cerca(q){
  q=q.trim(); const hb=document.getElementById('hb'), r=document.getElementById('gres');
  if(!q){ hb.classList.remove('hide'); r.classList.add('hide'); r.innerHTML=''; return; }
  hb.classList.add('hide'); r.classList.remove('hide'); r.innerHTML='';
  if(q.length<3){ r.appendChild(el('div','vuoto','Digita almeno 3 caratteri per cercare')); return; }
  const res=[];
  DATA.home.forEach(f=>{ if(match(f,q)) res.push([f,'#f28c1e','In evidenza']); });
  DATA.folders.forEach(c=>c.files.forEach(f=>{ if(match(f,q)) res.push([f,c.c,c.nome+(f.tag?' · '+f.tag:'')]); }));
  r.appendChild(el('h2','',res.length+(res.length===1?' risultato':' risultati')));
  if(!res.length) r.appendChild(el('div','vuoto','Nessun documento trovato'));
  res.forEach(x=>r.appendChild(docCard(x[0],x[1],x[2])));
}
function apri(i,push){
  const c=DATA.folders[i]; CUR=c;
  if(push){ try{history.pushState({v:'folder',i:i},'')}catch(e){} }
  const h=document.getElementById('fhead'); h.style.cssText=vars(c);
  h.innerHTML='<div class="tile">'+svg(c.icon,'#fff')+'</div><div><h1></h1><p class="s"></p></div>';
  h.querySelector('h1').textContent=c.nome; h.querySelector('.s').textContent=c.files.length+' documenti disponibili';
  document.getElementById('q').value=''; lista(''); show('folder');
}
function lista(q){
  q=q.trim(); const box=document.getElementById('flist'); box.innerHTML='';
  const r=q.length>=3?CUR.files.filter(f=>match(f,q)):CUR.files;
  if(!r.length) box.appendChild(el('div','vuoto','Nessun documento trovato'));
  r.forEach(f=>box.appendChild(docCard(f,CUR.c,f.tag)));
}
function indietro(){
  if(history.state&&history.state.v==='folder') history.back(); else vaiHome();
}
window.addEventListener('popstate',e=>{
  if(!LOG) return;
  const s=e.state;
  if(s&&s.v==='folder') apri(s.i,false); else vaiHome();
});
document.getElementById('q').addEventListener('input',e=>lista(e.target.value));
document.getElementById('gq').addEventListener('input',e=>cerca(e.target.value));
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')entra()});
try{ if(sessionStorage.getItem('ok')==='1'){ LOG=true; vaiHome(); try{history.replaceState({v:'home'},'')}catch(e){} } }catch(e){}
</script>
</body>
</html>
